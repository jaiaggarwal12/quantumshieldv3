<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantumShield — PQC Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { overflow: hidden; background: #F7F8FC; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      * { scrollbar-width: thin; scrollbar-color: #C8CDE0 transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #C8CDE0; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #9AA0BC; }
      button { font-family: inherit; }
      ::selection { background: #7c3aed33; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
